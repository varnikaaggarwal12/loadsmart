<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/assets/auth.js"></script>
<script src="/assets/success-popup.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Requests & Bookings — Admin — Load Smart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/search.css">
<link rel="stylesheet" href="/admin-assets/rate-requests.css">
</head>
<body>
<div class="page">

  <header>
    <a class="logo" href="/admin/dashboard">
      <img src="/assets/logo.jpeg" alt="Load Smart">
      <span class="sub">Admin Portal</span>
    </a>
    <a class="back-link" href="/admin/dashboard">← Back to dashboard</a>
  </header>

  <div class="content">
    <span class="eyebrow">Admin · Rate Requests</span>
    <h1>Rate Requests &amp; Bookings</h1>
    <p class="count-line" id="countLine">Loading...</p>
    <div style="display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap;">
      <div class="ls-search-box" style="max-width:420px; margin-bottom:0;">
        <span class="ls-search-icon">🔍</span>
        <input type="text" id="rateSearchInput" class="ls-search-input" placeholder="Search by Token No., shipper, or route…">
      </div>
      <button type="button" id="refreshBtn" class="refresh-btn">🔄 Refresh</button>
      <span id="lastUpdatedNote" class="last-updated-note"></span>
    </div>
    <div id="tableWrap"></div>
  </div>

</div>

<script src="/assets/search.js"></script>
<script src="/admin-assets/rate-requests.js"></script>
</body>
</html>
