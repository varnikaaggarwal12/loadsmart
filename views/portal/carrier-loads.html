<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="/assets/auth.js"></script>
<script src="/assets/tracking.js"></script>
<script src="/assets/success-popup.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Loads — Carrier — Load Smart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/search.css">
<link rel="stylesheet" href="/assets/trip-timeline.css">
<link rel="stylesheet" href="/portal-assets/carrier-loads.css">
</head>
<body>

<header>
  <a class="logo" href="/portal/carrier">
    <img src="/assets/logo.jpeg" alt="Load Smart">
    <span class="sub">Carrier Portal</span>
  </a>
  <div style="display:flex; align-items:center; gap:16px;">
    <button type="button" id="themeToggle" class="theme-toggle" aria-label="Toggle dark/light mode">
      <span id="themeIcon">🌙</span><span id="themeLabel">Dark</span>
    </button>
    <a class="back-link" href="/portal/carrier">← Back to My Account</a>
  </div>
</header>

<div class="content">
  <span class="eyebrow">Carrier Portal · My Loads</span>
  <h1>My Loads</h1>
  <p class="sub-line">Every load assigned to you — track its progress, view the auto-generated invoices, and upload Proof of Delivery once a load is marked Delivered.</p>

  <div class="ls-search-box" style="margin-bottom:18px; max-width:420px;">
    <span class="ls-search-icon">🔍</span>
    <input type="text" id="loadSearchInput" class="ls-search-input" placeholder="Search by Token No. or route…">
  </div>
  <div id="errorBanner" class="banner error"></div>

  <div id="loadListWrap">
    <div class="empty-state"><span class="ls-spinner"></span> Loading your assigned loads…</div>
  </div>
</div>

<script src="/assets/search.js"></script>
<script src="/assets/trip-timeline.js"></script>
<script src="/portal-assets/carrier-loads.js"></script>
</body>
</html>
