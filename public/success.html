<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registration submitted — Load Smart</title>
<link rel="stylesheet" href="/assets/register.css">
<link rel="stylesheet" href="/assets/search.css">
</head>
<body>
<div class="device">
  <div class="page">

    <header>
      <a class="logo" href="/">
        <img src="/assets/logo.jpeg" alt="Load Smart">
        <span class="sub">Pvt. Ltd.</span>
      </a>
      <a class="back-link" href="/">← Back to home</a>
    </header>

    <div class="form-shell" style="text-align:center; padding-top:80px;">
      <span class="form-eyebrow">Application received</span>
      <h1 id="title">Registration submitted</h1>
      <p class="intro" style="margin:0 auto 8px;">
        Thanks for registering with Load Smart. Our team will verify your details and get you set up shortly.
      </p>
      <p class="form-footer-note" id="ref-id" style="margin-top:20px;"></p>
      <p class="form-footer-note" id="username-line" style="margin-top:8px; font-weight:700;"></p>
      <div style="margin-top:34px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <a href="/" id="homeLink" class="submit-btn" style="display:inline-block; text-decoration:none; width:auto; padding:14px 32px; background:#f3f1e9; color:var(--ink);">Back to home</a>
        <a href="/" id="loginLink" class="submit-btn" style="display:none; text-decoration:none; width:auto; padding:14px 32px;">Continue to Login</a>
      </div>
    </div>

  </div>
</div>

<script src="/assets/tracking.js"></script>
<script src="/assets/success-popup.js"></script>
<script src="/assets/search.js"></script>
<script src="/success.js"></script>
</body>
</html>
